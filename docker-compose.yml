services:

  # ============================================================
  # Steno: Gespraeche mitschreiben, Dokumentation per GDT an T2med
  # ============================================================
  # Nur die Web-App. Whisper, Sprechertrennung und ollama laufen schon und
  # werden mitbenutzt — wie ki-transcribe und ki-atteste es auch tun:
  #   diktat-whisper, diktat-diarize  -> ../ki-transcribe/docker-compose.yml
  #   ollama                          -> eigener Container im ollama-net
  # Deshalb kein depends_on: ein "up" hier startet, stoppt oder ersetzt
  # keinen dieser Dienste.
  transcribe-gdt-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transcribe-gdt-web
    # 8010 gehoert ki-transcribe (gespraech-web)
    ports:
      - "127.0.0.1:8011:8000"
    environment:
      # Containernamen statt der Compose-Dienstnamen (faster-whisper, diarize):
      # die Dienstnamen sind Aliase des ki-transcribe-Projekts, die Container-
      # namen gelten in jedem Netz, in dem der Container haengt.
      - WHISPER_HOST=diktat-whisper
      - WHISPER_PORT=8000
      - OLLAMA_HOST=ollama
      - OLLAMA_PORT=11434
      - OLLAMA_MODEL=gemma4:12b
      # Kontextfenster (Untergrenze). Dieselbe wie in ki-transcribe: ollama
      # laedt das Modell bei jedem num_ctx-Wechsel neu, ein abweichender Wert
      # hier wuerde es zwischen beiden Apps hin- und herladen.
      - OLLAMA_NUM_CTX=16384
      - WHISPER_LANGUAGE=de
      - WHISPER_MEDICAL_MODEL=jimmymeister/whisper-large-v3-turbo-german-ct2
      - WHISPER_FAST_MODEL=small
      # Silero-VAD im Whisper-Server. Nur zum Abschalten da, falls VAD je sehr
      # leise Sprache wegschneidet — sonst anlassen, siehe CLAUDE.md.
      - WHISPER_VAD_FILTER=true
      - DIARIZE_HOST=diktat-diarize
      - DIARIZE_PORT=8000
      # 0/0 = pyannote schaetzt die Sprecherzahl selbst (Diktat bleibt 1,
      # Begleitperson/MFA duerfen 3+ sein)
      - DIARIZE_MIN_SPEAKERS=0
      - DIARIZE_MAX_SPEAKERS=0
      # Wartezeit auf Whisper und Diarisation. 30 min, damit auch eine
      # hochgeladene Dreiviertelstunde durchlaeuft.
      - AUDIO_TIMEOUT=1800
      - LOG_DIR=/logs
      # Eigenes Woerterbuch der Praxis (Namen, Kliniken, Orte), gepflegt in der
      # Oberflaeche. Liegt in ./daten, nicht im Image — ueberlebt jeden Rebuild.
      # Leer = aus. WOERTERBUCH_WHISPER_ZEICHEN: wie viel davon (die juengsten
      # Eintraege) als hotwords an Whisper geht; mehr frisst Decoder-Budget.
      - WOERTERBUCH=/daten/woerterbuch.json
      - WOERTERBUCH_WHISPER_ZEICHEN=300
      # Ortszeit: geht als Untersuchungszeit nach T2med und benennt die Logs
      - TZ=Europe/Berlin
      # --- T2med per GDT (gdt.py, Einrichtung: T2MED-EINRICHTUNG.md) ---
      # Austauschordner im Container; der Mount unten legt fest, was dahinter liegt.
      - GDT_DIR=/gdt
      # Arbeitsplatznummer = Endung der Austauschdateien (STNOT2MD.001 / T2MDSTNO.001)
      - GDT_ARBEITSPLAETZE=001=Sprechzimmer 1;002=Sprechzimmer 2;003=Sprechzimmer 3;004=Home
      - GDT_ID_PVS=T2MED
      - GDT_ID_GERAET=STENO
      - GDT_ZEICHENSATZ=2
      - GDT_KENNFELD=ALLG00
      # Minuten, die ein "Messung starten" auf seine Aufnahme wartet
      - GDT_AUFTRAG_GUELTIG=60
      # Umbruch der Dokumentation in GDT-Felder. T2med zeigt jedes Feld als eigene
      # Zeile, 60 (GDT-2.1-Empfehlung) zerhackt die Absaetze. 990 = Formatgrenze.
      - GDT_ZEILENBREITE=990
      # Wie T2med den Austauschordner sieht - nur fuer den Transkript-Anhang,
      # leer = kein Anhang. Beispiel: S:\_steno (Netzlaufwerk S: von sono-gdt)
      - GDT_PVS_PFAD=
      # Debug: je Uebergabe die Antwort des Sprachmodells und die GDT-Datei als
      # Kopie nach ./logs/gdt-debug (T2med loescht das Original nach dem Lesen).
      # Patientendaten! Nach dem Einrichten leer setzen und den Ordner leeren.
      - GDT_DEBUG_DIR=/logs/gdt-debug
      # Zweites T2med-Geraet "Steno Psychotherapie" (T2MED-EINRICHTUNG.md).
      # Erst einkommentieren, wenn es an ALLEN Arbeitsplaetzen in T2med
      # eingerichtet ist — sonst holt niemand die Ergebnisdatei ab.
      # - GDT_PSY_DATEINAME=T2MDSTNP.{ap}
      # - GDT_PSY_AUFTRAG_DATEINAME=STNPT2MD.{ap}
      # - GDT_PSY_ID_GERAET=STENO_PT
      # --- T2med per FHIR (fhir.py, Einrichtung: T2MED-EINRICHTUNG.md, Abschnitt FHIR) ---
      # Zweiter Weg neben GDT: Drittanbieter-Knopf "Steno" in T2med. Aus, solange
      # FHIR_API_KEY oder FHIR_HOSTS leer sind. Den Schluessel nicht hier
      # eintragen, sondern in .env (FHIR_API_KEY=...) — die Datei ist gitignored.
      - FHIR_API_KEY=${FHIR_API_KEY:-}
      # Host(s) des T2med-Servers, wie sie in der fhirBasisUrl stehen (Komma-getrennt).
      # Nur dorthin schickt der Server Dokumentationen.
      - FHIR_HOSTS=${FHIR_HOSTS:-}
      # T2med-Serverzertifikat (PEM) im Container, z. B. /certs/t2med.pem; leer = keine Pruefung
      - FHIR_ZERTIFIKAT=
      # freitext = ein Eintrag mit Kuerzel (Standard) | abpro = A/B/PRO als eigene Karteikarten-Zeilen
      # | kuerzel = A/B/PRO als drei Freitexte mit den Kuerzeln aus FHIR_ABPRO_KUERZEL
      - FHIR_AUSGABE=kuerzel
      - FHIR_ABPRO_KUERZEL=KAN,KBE,KPR
      - FHIR_KUERZEL=KI
      - FHIR_PSY_KUERZEL=KI
      # Transkript als Anhang in die Kartei (nie bei Psychotherapie)
      - FHIR_ANHANG=false
      # --- Steno-Knopf (client/, Einrichtung: client/README.md) ---
      # Dokumentationsart fuer Sprechstunden (abpro | analyze | summary)
      - STENO_MODUS=abpro
      # Ab dieser Laenge fragt der Server ohne Vorgabe das Sprachmodell, ob es
      # eine Psychotherapie-Sitzung war
      - STENO_PSY_AB_MINUTEN=20
      # Minuten, die eine fertige Dokumentation auf die Abholung durch T2med wartet
      - STENO_SENDEN_WARTEN=60
      # Stunden, die fertige Auftraege (mit Text) fuer /verlauf im Speicher bleiben
      - STENO_AUFBEWAHRUNG=12
      # Transkript in Abschnitten schon waehrend der Aufnahme:
      # direkt (nur Direkt-Aufnahmen) | alle (jede Knopf-Aufnahme) | aus
      - STENO_BLOECKE=direkt
    # Development: Quellcode live einbinden (kein Rebuild bei Änderungen)
    volumes:
      - ./server.py:/app/server.py:ro
      - ./prompts.py:/app/prompts.py:ro
      - ./medical_vocab.py:/app/medical_vocab.py:ro
      - ./medikamente_wortliste.json:/app/medikamente_wortliste.json:ro
      - ./gdt.py:/app/gdt.py:ro
      - ./fhir.py:/app/fhir.py:ro
      - ./templates:/app/templates:ro
      - ./static:/app/static:ro
      - ./logs:/logs
      # Der Ordner, nicht die Datei: gespeichert wird per Temp-Datei + Umbenennen
      - ./daten:/daten
      # GDT-Austauschordner, den auch T2med erreichen muss: S:\_steno auf der
      # sono-gdt-Freigabe (Volume gdt-share unten, Zugangsdaten in .env).
      # Zum Testen ohne T2med stattdessen "./gdt:/gdt".
      - gdt-share:/gdt
    networks:
      - diktat-network
      - ollama-network
      - caddy-proxy-network
    restart: unless-stopped

# ============================================================
# NETZWERKE — alle extern, angelegt von ki-transcribe bzw. ollama/Caddy
# ============================================================
networks:
  diktat-network:
    external: true
    name: diktat-network

  ollama-network:
    external: true
    name: ollama-net

  caddy-proxy-network:
    external: true
    name: caddy-proxy-network

# ============================================================
# VOLUMES
# ============================================================
# GDT-Austauschordner auf der Freigabe von sono-gdt (statt ./gdt): Unterordner
# _steno, an den Arbeitsplaetzen S:\_steno. Der Ordner muss existieren. Der
# Unterstrich ist noetig, sonst haelt sono-gdt ihn fuer einen Patientenordner.
# Gemountet wird nur _steno, nicht die Ultraschallbilder.
# Zugangsdaten nicht einchecken - in .env ablegen.
volumes:
  gdt-share:
    driver: local
    driver_opts:
      type: cifs
      device: //192.168.2.70/sono-gdt/_steno
      o: "username=${GDT_SMB_USER},password=${GDT_SMB_PASSWORD},domain=${GDT_SMB_DOMAIN:?GDT_SMB_DOMAIN in .env fehlt},uid=0,gid=0,file_mode=0660,dir_mode=0770,vers=3.0"
