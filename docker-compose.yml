services:

  # ============================================================
  # KI-Gesprächsanalyse Web-App
  # ============================================================
  gespraech-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gespraech-web
    ports:
      - "127.0.0.1:8010:8000"
    environment:
      - WHISPER_HOST=faster-whisper
      - WHISPER_PORT=8000
      - OLLAMA_HOST=ollama
      - OLLAMA_PORT=11434
      - OLLAMA_MODEL=gemma4:12b
      - WHISPER_LANGUAGE=de
      - WHISPER_MEDICAL_MODEL=jimmymeister/whisper-large-v3-turbo-german-ct2
      - WHISPER_FAST_MODEL=small
      - DIARIZE_HOST=diarize
      - DIARIZE_PORT=8000
      # 0/0 = pyannote schaetzt die Sprecherzahl selbst (Diktat bleibt 1,
      # Begleitperson/MFA duerfen 3+ sein)
      - DIARIZE_MIN_SPEAKERS=0
      - DIARIZE_MAX_SPEAKERS=0
      - LOG_DIR=/logs
    # Development: Quellcode live einbinden (kein Rebuild bei Änderungen)
    volumes:
      - ./server.py:/app/server.py:ro
      - ./prompts.py:/app/prompts.py:ro
      - ./medical_vocab.py:/app/medical_vocab.py:ro
      - ./templates:/app/templates:ro
      - ./static:/app/static:ro
      - ./logs:/logs
    depends_on:
      - faster-whisper
      - diarize
    networks:
      - diktat-network
      - ollama-network
      - caddy-proxy-network
    restart: unless-stopped

  # ============================================================
  # Diarisation (Sprechertrennung, CPU) – pyannote.audio
  # ============================================================
  # Bewusst CPU und bewusst ein eigener Container: der geteilte Whisper-Container
  # bleibt unangetastet, die Pipeline braucht keine GPU-Zuteilung, und ein
  # spaeterer GPU-Wechsel beruehrt die Sprechertrennung nicht.
  # Erster Build braucht ./.hf_token – siehe diarize/README.md
  diarize:
    build:
      context: ./diarize
      dockerfile: Dockerfile
      secrets:
        - hf_token
    container_name: diktat-diarize
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8002:8000"
    environment:
      - PYANNOTE_MODEL=pyannote/speaker-diarization-3.1
      - TORCH_THREADS=4
      - TZ=Europe/Berlin
    # Development: Quellcode live einbinden (kein Rebuild bei Änderungen)
    volumes:
      - ./diarize/app.py:/app/app.py:ro
    networks:
      - diktat-network
    restart: unless-stopped

  # ============================================================
  # faster-whisper (Transkription, GPU) – geteilt mit ki-atteste
  # ============================================================
  faster-whisper:
    image: fedirz/faster-whisper-server:latest-cuda
    container_name: diktat-whisper
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8001:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - WHISPER__MODEL=large-v3
      - WHISPER__INFERENCE_DEVICE=cuda
      - WHISPER__COMPUTE_TYPE=float16
      - WHISPER__ALLOW_DOWNLOADS=true
      - TZ=Europe/Berlin
    volumes:
      - whisper-models:/root/.cache/huggingface
    networks:
      - diktat-network
      - caddy-proxy-network
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

# ============================================================
# SECRETS
# ============================================================
# Hugging-Face-Token, nur zur Build-Zeit (gated pyannote-Modelle).
# Als BuildKit-Secret gemountet, landet also nicht im Image.
secrets:
  hf_token:
    file: ./.hf_token

# ============================================================
# NETZWERKE
# ============================================================
networks:
  diktat-network:
    driver: bridge
    name: diktat-network

  ollama-network:
    external: true
    name: ollama-net

  caddy-proxy-network:
    external: true
    name: caddy-proxy-network

# ============================================================
# VOLUMES
# ============================================================
volumes:
  whisper-models:
