services:

  # ============================================================
  # KI-Gesprächsanalyse Web-App
  # ============================================================
  gespraech-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gespraech-web
    ports:
      - "127.0.0.1:8010:8000"
    environment:
      - WHISPER_HOST=faster-whisper
      - WHISPER_PORT=8000
      - OLLAMA_HOST=ollama
      - OLLAMA_PORT=11434
      - OLLAMA_MODEL=qwen2.5:14b
      - WHISPER_LANGUAGE=de
    # Development: Quellcode live einbinden (kein Rebuild bei Änderungen)
    volumes:
      - ./server.py:/app/server.py:ro
      - ./templates:/app/templates:ro
      - ./static:/app/static:ro
    depends_on:
      - faster-whisper
    networks:
      - diktat-network
      - ollama-network
      - caddy-proxy-network
    restart: unless-stopped

  # ============================================================
  # faster-whisper (Transkription, GPU)
  # ============================================================
  faster-whisper:
    image: fedirz/faster-whisper-server:latest-cuda
    container_name: diktat-whisper
    runtime: nvidia
    environment:
      - WHISPER__MODEL=large-v3
    volumes:
      - whisper-models:/root/.cache/huggingface
    networks:
      - diktat-network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

# ============================================================
# NETZWERKE
# ============================================================
networks:
  diktat-network:
    driver: bridge

  ollama-network:
    external: true
    name: ollama-net

  caddy-proxy-network:
    external: true
    name: caddy-proxy-network

# ============================================================
# VOLUMES
# ============================================================
volumes:
  whisper-models:
    driver: local
