services:

  # ============================================================
  # KI-Gesprächsanalyse Web-App
  # ============================================================
  gespraech-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gespraech-web
    ports:
      - "127.0.0.1:8010:8000"
    environment:
      - WHISPER_HOST=faster-whisper
      - WHISPER_PORT=8000
      - OLLAMA_HOST=ollama
      - OLLAMA_PORT=11434
      - OLLAMA_MODEL=gemma4:12b
      - WHISPER_LANGUAGE=de
      - WHISPER_MEDICAL_MODEL=jimmymeister/whisper-large-v3-turbo-german-ct2
      - WHISPER_FAST_MODEL=small
      - DIARIZE_HOST=diarize
      - DIARIZE_PORT=8000
      # 0/0 = pyannote schaetzt die Sprecherzahl selbst (Diktat bleibt 1,
      # Begleitperson/MFA duerfen 3+ sein)
      - DIARIZE_MIN_SPEAKERS=0
      - DIARIZE_MAX_SPEAKERS=0
      - LOG_DIR=/logs
    # Development: Quellcode live einbinden (kein Rebuild bei Änderungen)
    volumes:
      - ./server.py:/app/server.py:ro
      - ./prompts.py:/app/prompts.py:ro
      - ./medical_vocab.py:/app/medical_vocab.py:ro
      - ./templates:/app/templates:ro
      - ./static:/app/static:ro
      - ./logs:/logs
    depends_on:
      - faster-whisper
      - diarize
    networks:
      - diktat-network
      - ollama-network
      - caddy-proxy-network
    restart: unless-stopped

  # ============================================================
  # Diarisation (Sprechertrennung, GPU) – pyannote.audio
  # ============================================================
  # Eigener Container, damit der mit ki-atteste geteilte Whisper-Container
  # unangetastet bleibt. Auf der CPU war die Pipeline mit ~0,6x Echtzeit der
  # Flaschenhals der gesamten Analyse (15 min Rechenzeit fuer 25 min Aufnahme,
  # waehrend Whisper auf der GPU nach gut einer Minute fertig war) – siehe
  # Kopfkommentar in diarize/app.py.
  #
  # Kartenwechsel (z. B. auf eine Intel Arc) sind bewusst reine Konfiguration:
  # TORCH_INDEX_URL waehlt das Wheel, der devices-/deploy-Block die Zuteilung.
  # DIARIZE_DEVICE=auto erkennt CUDA bzw. XPU selbst, der Quelltext bleibt gleich.
  # Erster Build braucht ./.hf_token – siehe diarize/README.md
  diarize:
    build:
      context: ./diarize
      dockerfile: Dockerfile
      args:
        # NVIDIA: cu128 ist Pflicht, die RTX 5080 ist Blackwell (sm_120).
        # Intel Arc: auf https://download.pytorch.org/whl/xpu umstellen.
        # Ohne GPU: https://download.pytorch.org/whl/cpu
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu128
      secrets:
        - hf_token
    container_name: diktat-diarize
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8002:8000"
    environment:
      - PYANNOTE_MODEL=pyannote/speaker-diarization-3.1
      - DIARIZE_DEVICE=auto
      # Greift nur, wenn kein Grafikgeraet gefunden wird (CPU-Rueckfall).
      - TORCH_THREADS=8
      - TZ=Europe/Berlin
    # Development: Quellcode live einbinden (kein Rebuild bei Änderungen)
    volumes:
      - ./diarize/app.py:/app/app.py:ro
    # NVIDIA-Zuteilung. Die Karte wird mit faster-whisper und ollama geteilt;
    # pyannote braucht nur 1–2 GB VRAM und laeuft nur waehrend einer Analyse.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Fuer eine Intel Arc stattdessen den deploy-Block loeschen und das
    # WSL2-Grafikgeraet durchreichen. NICHT /dev/dri — unter Docker Desktop
    # laeuft die GPU ueber die WSL2-Paravirtualisierung, der Knoten heisst
    # /dev/dxg und die Treiberbibliotheken liegen in /usr/lib/wsl:
    # devices:
    #   - /dev/dxg:/dev/dxg
    # volumes:
    #   - ./diarize/app.py:/app/app.py:ro
    #   - /usr/lib/wsl:/usr/lib/wsl:ro
    # environment:
    #   - LD_LIBRARY_PATH=/usr/lib/wsl/lib
    networks:
      - diktat-network
    restart: unless-stopped

  # ============================================================
  # faster-whisper (Transkription, GPU) – geteilt mit ki-atteste
  # ============================================================
  faster-whisper:
    image: fedirz/faster-whisper-server:latest-cuda
    container_name: diktat-whisper
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8001:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - WHISPER__MODEL=large-v3
      - WHISPER__INFERENCE_DEVICE=cuda
      - WHISPER__COMPUTE_TYPE=float16
      - WHISPER__ALLOW_DOWNLOADS=true
      - TZ=Europe/Berlin
    volumes:
      - whisper-models:/root/.cache/huggingface
    networks:
      - diktat-network
      - caddy-proxy-network
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

# ============================================================
# SECRETS
# ============================================================
# Hugging-Face-Token, nur zur Build-Zeit (gated pyannote-Modelle).
# Als BuildKit-Secret gemountet, landet also nicht im Image.
secrets:
  hf_token:
    file: ./.hf_token

# ============================================================
# NETZWERKE
# ============================================================
networks:
  diktat-network:
    driver: bridge
    name: diktat-network

  ollama-network:
    external: true
    name: ollama-net

  caddy-proxy-network:
    external: true
    name: caddy-proxy-network

# ============================================================
# VOLUMES
# ============================================================
volumes:
  whisper-models:
